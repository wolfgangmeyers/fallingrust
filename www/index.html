<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="canonical" href="https://jabberwocky.ca/fallingrust/" />

    <title>Falling Rust</title>

    <script src="./bootstrap.js"></script>

    <style>
      canvas {
        background-color: black;
      }
      #space {
        border: 1px solid white;
        float: left;
      }

      #select-types button {
        display: block;
        width: 10em;
      }

      #top-area {
        overflow: hidden;
      }
      
      #brush-size-container {
        margin-top: 10px;
      }
      
      #brush-size-slider {
        width: 150px;
        vertical-align: middle;
      }
      
      #brush-size-value {
        display: inline-block;
        width: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>

    <div id="top-area">
      <canvas id="space"></canvas>
      <div id="select-types"></div>
    </div>
    <div>
      <div>
        <button id="play-pause">Play/Pause</button>
        <span id="frame-rate"></span>
      </div>
      <div id="brush-size-container">
        <label for="brush-size-slider">Brush Size: </label>
        <input type="range" id="brush-size-slider" min="0" max="10" value="2" step="1">
        <span id="brush-size-value">2</span>
      </div>
    </div>

  </body>
</html>
